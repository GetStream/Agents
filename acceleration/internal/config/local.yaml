# A router on a laptop, against the Postgres and Redis that compose.yaml starts.
# Anything already set, by .env or the shell, wins over this file.
addr: ":8080"
postgres:
  dsn: postgres://postgres:postgres@localhost:55432/model_router?sslmode=disable
redis:
  addr: localhost:56379
# In development mode, run background work in-process by default so no separate
# `router async-worker` process is required. Override with ROUTER_ASYNC_BACKEND=asynq
# to test Redis-backed workers locally.
async:
  backend: in_process
  worker:
    enabled: true
    queues:
      - all
    concurrency: 8
