name: Release check
# Proves, without publishing, that a release would build every Python package at the tag's
# version. It runs the build steps of release.yml (the build-python-packages action) on a local
# tag, and has no `uv publish`, no `pypi` environment and no `id-token` permission, so it can
# never reach PyPI. Run it by hand (Actions > Release check) before you tag a release.
on:
  pull_request:
    branches: [ "**" ]
    # A draft runs nothing: CI starts when the pull request is marked ready (ready_for_review).
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-check.yml'
      - '.github/actions/build-python-packages/**'
      - '.github/actions/python-uv-setup/**'
      - '.github/scripts/check-release-version.sh'
      - '.github/release-build-constraints.txt'
      - '**/pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build every package at the release version
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      # A version no release has, so the check never meets a real tag.
      TAG: v99.0.0
    steps:
      # The release job checks out the same way: one commit, no tags but the release's.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Tag this commit as the release
        run: |
          git tag "$TAG"
          git tag --list

      - name: Build all distributions
        uses: ./.github/actions/build-python-packages
        with:
          tag: ${{ env.TAG }}

      # Each wrong input must fail the version check. If one passes, the check no longer guards
      # the upload.
      - name: A wrong tag or a wrong file version must fail the check
        run: |
          fails() {
            if "$@" > /dev/null 2>&1; then
              echo "::error::passed, but must fail: $*"
              exit 1
            fi
            echo "failed as expected: $*"
          }
          fails .github/scripts/check-release-version.sh v99.0.1 dist
          fails .github/scripts/check-release-version.sh 99.0.0 dist
          fails .github/scripts/check-release-version.sh v99.0.0-rc1 dist
          wheels=(dist/*.whl)
          mkdir wrong empty
          cp "${wheels[0]}" "wrong/$(basename "${wheels[0]}" | sed 's/-99\.0\.0-/-99.0.1-/')"
          fails .github/scripts/check-release-version.sh "$TAG" wrong
          fails .github/scripts/check-release-version.sh "$TAG" empty

      # Metadata PyPI refuses, such as a long description that does not render.
      - name: Check the package metadata
        run: uvx -q --from twine==7.0.0 twine check dist/*

      # PyPI takes an upload to a project that does not exist only from a pending trusted
      # publisher. This repo cannot read that setting, so the step lists the projects to look at.
      - name: List the projects PyPI does not have yet
        run: |
          missing=""
          for wheel in dist/*.whl; do
            name=$(basename "$wheel" | cut -d- -f1 | tr _ -)
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$name/json")
            [ "$code" = 200 ] || missing="$missing $name($code)"
          done
          if [ -n "$missing" ]; then
            echo "::warning::not on PyPI, needs a pending trusted publisher before a release:$missing"
          fi
