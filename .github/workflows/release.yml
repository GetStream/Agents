name: Integration (pre-release / release)
on:
  release:
    types: [published] # Run after a Github publish

permissions:
  contents: read

# Only a release of the whole repo, tagged vX.Y.Z, publishes the Python packages. A release
# made for another tag, such as the Go SDK's sdks/go/vX.Y.Z, sdk-js-vX.Y.Z, accelerate-vX.Y.Z
# or sdk-dotnet-vX.Y.Z, runs nothing here.
jobs:
  integration:
    if: startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/run_tests.yml
    with:
      marker: 'integration'
      # The provider keys live in this environment.
      environment: integration
    secrets: inherit

  build-core:
    name: Build & Test Core SDK
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-4core
    environment: pypi
    # Not gated on `integration`, by decision: a provider outage must not hold back a release, so
    # this run can end `failure` after a good publish. Check this job, not the run's conclusion.
    # The OIDC token is this job's alone, so the integration job, which holds every
    # provider secret, cannot mint one.
    permissions:
      contents: read
      id-token: write       # REQUIRED for PyPI Trusted Publishing (OIDC)
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Builds every package and fails, before anything is uploaded, unless each file carries the
      # tag's version. release-check.yml runs the same steps without the PyPI environment.
      - name: Build all distributions
        id: build
        uses: ./.github/actions/build-python-packages
        with:
          tag: ${{ github.event.release.tag_name }}

      # `always`: the default, `automatic`, carries on without credentials when uv cannot get a
      # token. Each PyPI project must list this workflow file and the `pypi` environment as a
      # trusted publisher.
      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish --trusted-publishing always

  test-core-index:
    name: Verify PIP install works
    needs: build-core
    runs-on: ubuntu-4core
    env:
      UV_NO_SOURCES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/python-uv-setup

      - name: Install core PyPI using uv
        run: |
          uv pip install vision-agents==${{ needs.build-core.outputs.version }}