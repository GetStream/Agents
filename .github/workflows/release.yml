name: Integration (pre-release / release)
on:
  release:
    types: [published] # Run after a Github publish

permissions:
  contents: read

# Only a release of the whole repo, tagged vX.Y.Z on main and not a pre-release, publishes the
# Python packages. A release made for another tag, such as the Go SDK's sdks/go/vX.Y.Z,
# sdk-js-vX.Y.Z, accelerate-vX.Y.Z or sdk-dotnet-vX.Y.Z, runs nothing here. PyPI never takes a
# version back, so the checks are the same as in release-sdks.yml.
jobs:
  gate:
    name: Decide whether to publish
    runs-on: { group: github-public-amd64 }
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Check the release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          nothing() {
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$PRERELEASE" = true ]; then
            nothing "\`$RELEASE_TAG\` is a pre-release or not a vX.Y.Z release, so nothing is published."
          fi
          # GITHUB_SHA is the tagged commit. The compare status is "behind" or "identical" when
          # that commit is already in main.
          status=$(gh api "repos/$GH_REPO/compare/main...$GITHUB_SHA" --jq .status)
          if [ "$status" != behind ] && [ "$status" != identical ]; then
            nothing "\`$RELEASE_TAG\` is not on main, so nothing is published."
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  integration:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    uses: ./.github/workflows/run_tests.yml
    with:
      marker: 'integration'
      # The provider keys live in this environment.
      environment: integration
    secrets: inherit

  build-core:
    name: Build & Test Core SDK
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: { group: github-public-amd64 }
    environment: pypi
    # Not gated on `integration`, by decision: a provider outage must not hold back a release, so
    # this run can end `failure` after a good publish. Check this job, not the run's conclusion.
    # The OIDC token is this job's alone, so the integration job, which holds every
    # provider secret, cannot mint one.
    permissions:
      contents: read
      id-token: write       # REQUIRED for PyPI Trusted Publishing (OIDC)
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Builds every package and fails, before anything is uploaded, unless each file carries the
      # tag's version. release-check.yml runs the same steps without the PyPI environment.
      - name: Build all distributions
        id: build
        uses: ./.github/actions/build-python-packages
        with:
          tag: ${{ github.event.release.tag_name }}

      # `always`: the default, `automatic`, carries on without credentials when uv cannot get a
      # token. Each PyPI project must list this workflow file and the `pypi` environment as a
      # trusted publisher.
      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish --trusted-publishing always

  test-core-index:
    name: Verify PIP install works
    needs: build-core
    runs-on: { group: github-public-amd64 }
    env:
      UV_NO_SOURCES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/python-uv-setup

      - name: Install core PyPI using uv
        run: |
          uv pip install vision-agents==${{ needs.build-core.outputs.version }}